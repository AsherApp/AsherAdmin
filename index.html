<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asher Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              slideInBottom: {
                '0%': { transform: 'translateY(10%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              zoomIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in-right': 'slideInRight 0.3s ease-out',
              'slide-in-bottom': 'slideInBottom 0.4s ease-out',
              'zoom-in': 'zoomIn 0.2s ease-out',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Glassmorphism background */
        background-color: #F3F4F6;
        background-image: 
          radial-gradient(at 0% 0%, hsla(348, 83%, 89%, 1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(0, 0%, 100%, 1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(348, 83%, 92%, 1) 0, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        min-height: 100vh;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.4); 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(220, 38, 38, 0.5); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(220, 38, 38, 0.8); 
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }
      
      .glass-input {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .glass-input:focus {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(220, 38, 38, 0.4);
      }

      .glass-modal-overlay {
         background: rgba(0, 0, 0, 0.2);
         backdrop-filter: blur(4px);
      }
      
      /* Utility for Tailwind animate-in mapping */
      .animate-in { animation-duration: 0.3s; animation-fill-mode: both; }
      .slide-in-from-right { animation-name: slideInRight; }
      .slide-in-from-bottom-4 { animation-name: slideInBottom; }
      .zoom-in-95 { animation-name: zoomIn; }
      .fade-in { animation-name: fadeIn; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
