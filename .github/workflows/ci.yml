name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Match lockfile npm
        run: npm i -g npm@11

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Production build
        run: npx vite build
